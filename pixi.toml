[workspace]
authors = ["ian-flores <iflores.siaca@hey.com>"]
channels = ['https://conda.modular.com/max', 'conda-forge']
name = "pytensor-mojo"
platforms = ['osx-arm64']
version = "0.1.0"


[dependencies]
mojo = ">=1.2,<1.3"
python = "3.12.*"
numpy = ">=2.5.5,<3"
pytensor = ">=3.3.8,<4"
pymc = ">=6.4.0,<7"
nutpie = ">=0.16.11,<0.17"
pytest = ">=9.2.0,<10"
numba = ">=0.67.0,<0.68"
max = ">=26.7,<26.8"

[tasks]
build = "./build.sh"
build-sampler = "cargo build --release --manifest-path sampler/Cargo.toml"
test = { cmd = "pytest -v tests", depends-on = ["build", "build-sampler"] }
test-rust = { cmd = "cargo fmt --check && cargo clippy --release --all-targets -- -D warnings && cargo test --release", cwd = "sampler", depends-on = ["build"] }
bench-phase2 = { cmd = "python bench/phase2_nuts.py --reps 5", depends-on = ["build", "build-sampler"] }
bench-phase3 = { cmd = "python bench/phase2_nuts.py --reps 5 --out bench/phase3_results.json", depends-on = ["build", "build-sampler"] }
bench-phase4 = { cmd = "python bench/phase4_sampling.py --reps 5", depends-on = ["build", "build-sampler"] }
accuracy = "python bench/phase4_accuracy.py"
census-phase4 = "python bench/phase4_census.py"
docs-assets = "python docs/gen/build_assets.py"
bench-q1 = { cmd = "python bench/q1_overhead.py", depends-on = ["build"] }
bench-q2 = { cmd = "python bench/q2_eight_schools.py", depends-on = ["build"] }
census = "python bench/q3_op_census.py"

[feature.docs.dependencies]
python = "3.12.*"
mkdocs = "1.6.*"
mkdocs-material = "9.8.*"
mkdocstrings-python = "2.0.*"
black = "*"

[feature.docs.tasks]
docs-build = { cmd = "mkdocs build --strict", env = { NO_MKDOCS_2_WARNING = "1" } }
docs-serve = { cmd = "mkdocs serve --strict --dev-addr 127.0.0.1:{{ port }}", args = [{ arg = "port", default = "8000" }], env = { NO_MKDOCS_2_WARNING = "1" } }

[environments]
docs = { features = ["docs"], no-default-feature = true }
