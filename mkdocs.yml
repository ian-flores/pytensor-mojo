site_name: pytensor-mojo
site_description: A Mojo backend for PyTensor / PyMC with C-ABI kernels sampled by nuts-rs.
site_url: https://ian-flores.github.io/pytensor-mojo/
repo_url: https://github.com/ian-flores/pytensor-mojo
repo_name: ian-flores/pytensor-mojo
edit_uri: ""
copyright: Apache-2.0

docs_dir: docs
exclude_docs: |
  _generated/
  gen/
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest

extra:
  datasheet:
    part: PYTENSOR-MOJO
    doc: DS-PTM-01
    rev: 0.2-dev
    status: Experimental research prototype
  generator: false

extra_css:
  - assets/datasheet.css

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: false
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs/_generated, ., docs]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            allow_inspection: false
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_"]

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - Compiling models: guide/compiling.md
      - The C ABI: guide/c-abi.md
      - The mojo-nuts sampler: guide/sampler-cli.md
      - The MOJO_ND PyTensor mode: guide/pytensor-mode.md
      - Environment flags: guide/flags.md
      - Troubleshooting: guide/troubleshooting.md
  - Reference:
      - Supported distributions and ops: reference/supported.md
      - Python API: reference/api.md
  - Concepts: concepts.md
  - Benchmarks:
      - Sampling performance: benchmarks.md
      - Special-function accuracy: accuracy.md
      - posteriordb sweep: benchmarks/posteriordb.md
  - Project:
      - Limitations and roadmap: limitations.md
      - Upstream issues: upstream-issues.md
      - Contributing: contributing.md
      - Revision history: changelog.md
  - Research log:
      - Findings, phases 1-4: FINDINGS.md
      - Backend interface notes: backend_interface.md
