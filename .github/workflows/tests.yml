name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Mojo 1.2 targets macOS on Apple Silicon only and needs Xcode / CLT 16+,
    # which is the default toolchain on the macos-15 arm64 image.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcode-select -p
          clang --version

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.85.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          locked: true

      # Pinned so a new stable clippy lint cannot turn unrelated PRs red; bump on purpose.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sampler -> target

      - name: Rust checks (fmt, clippy -D warnings, cargo test)
        run: pixi run test-rust

      - name: Python test suite
        run: pixi run test -rs
